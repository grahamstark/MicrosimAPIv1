<!DOCTYPE html>

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <script src='js/jquery.js'></script>
    <script src='js/jquery.periodicalupdater.js'></script>
    <script src='js/jquery.validate.js'></script>
    <script src='js/jquery.number.js'></script>
    <script src="js/bootstrap.bundle.js"></script>
    <script src="js/mustache.min.js"></script>
    <style>
        .bg-purple {background:#cdf;}
        .bg-orange {background:#fec;}
        .modcon:hover {filter:brightness(0.6);}
    </style>

<script>

const API = "http://microapi-local/";
const UID =  -1 //4907240437919486244;
const MODEL = "scotben";
const EDITION = "simple-2026a";
const SUBSYS = "SimpleParams"

var sys = JSON.stringify({
  "taxrates":[19.0,20.0,21.0,42.0,45.0,48.0],
  "taxbands":[3967.0,16956.0,31092.0,62430.0,125140.0],
  "nirates":[0.0,0.0,8.0,2.0],
  "nibands":[129.0,242.0,967.0],
  "taxallowance":12570.0,
  "child_benefit":27.05,
  "pension":241.3,
  "scottish_child_payment":28.2,
  "scp_age":15,
  "uc_single":424.9,
  "uc_taper":55.0
})



function getUID(){
    var uid = localStorage.getItem( "scotben-uid");
    if(uid == null){
        uid = $( "#uid" ).val();
        if(uid !== null){
            localStorage.setItem( "scotben-uid", uid );
        }
    }
    console.log( "getUID; got id as ", uid );
    return uid;
}

function setUID( uid ){
    // localStorage.setItem( "uid", uid );
    $( "#uid" ).val( uid );
    localStorage.setItem("scotben-uid", uid );
}


async function get_output_item( uid, item, datatype ){
    const url = [API,"output","fetch",MODEL,EDITION,datatype,item].join("/") + "?uid="+uid;
    console.log( "get_output_item; fetching " + url )
    await fetch(url)
        .then( response=>response.text())
        .then( data => {
            // console.log(data);
            const container = document.getElementById(item);
            container.innerHTML = data;
        });
}

async function get_output( uid ){
    get_output_item( uid, 'children_gl', 'html');
    get_output_item( uid, 'hhtype_gl', 'html');
    get_output_item( uid, 'ten_gl', 'html');
    get_output_item( uid, 'dec_gl', 'html');

    get_output_item( uid, 'summary_graphs', 'svg');
    get_output_item( uid, 'taxable_graph', 'svg');
    get_output_item( uid, 'hbai', 'svg');
    get_output_item( uid, 'lorenz_curve', 'svg');
    get_output_item( uid, 'deciles', 'svg');
    get_output_item( uid, 'metrs', 'svg');
    get_output_item( uid, 'metrs_hist', 'svg');
}


function setVal( id, val, def ){
    $( "#"+id ).val( val );
    console.log( "setVal for #%s val=%s def=%s", id, val, def )
    if( val != def ){
        $( "#"+id ).addClass( 'changed');
    } else {
        $( "#"+id ).removeClass( 'changed');
    }
}

async function initialise(){
    var uid = getUID();
    // initial parameters
    const url = [API,"params","get",MODEL,EDITION,SUBSYS].join("/") + "?uid="+uid;
    console.log( "initialise; fetching " + url )
    await fetch(url)
        .then( response=>response.json())
        .then( data => {
            console.log("fetch params got data as " + data.uid);
            if(uid != data.uid){
                uid = data.uid;
                setUID( uid );
            }
    });
    console.log( "uid=" + uid );
    get_output( uid );
}


$(document).ready(function(){
    // load default params ..
    console.log( "ready - initialise")
    initialise();
});

</script>

</head>

<body class='text-primary p-2'>

    <svg id='hbai' height="1250" width='1008' viewBox="0 0 2100 2558"></svg>
    <svg id='lorenz_curve' height="625" width='1008' viewBox="0 0 2100 1297"></svg>
    <svg id='deciles' height="625" width='1008' viewBox="0 0 2100 1297"></svg>
    <svg id='metrs' height="1250" width='1008' viewBox="0 0 2100 2558"></svg>
    <svg id='metrs_hist' height="625" width='1008' viewBox="0 0 2100 1297"></svg>

    <div id='children_gl'></div>
    <div id='hhtype_gl'></div>
    <div id='ten_gl'></div>
    <div id='dec_gl'></div>


</body>
