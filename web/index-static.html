function getResult( item ){
    var url = "http://scotben-2026/output-examples/"+item+".json";
    console.log( "get_result; url=", url);
    var jqXHR = $.ajax({
        url: url,
        method: 'get',
        contentType: "application/json"});
    var x = jqXHR.done(
        function( data ){
            console.log( data.responseJSON );
            return data.item;
        });

}


async function processGainLose(){
    const gl_d = await d3.json("output-examples/gainlose-bydecile.json");
    const gl_ten = await d3.json("output-examples/ten-gl.json");
    const ineqData = await d3.json("output-examples/inequality.json");
    const headlineData = await d3.json("output-examples/headline-figures.json");

    console.log( "ineqData", ineqData );
    console.log( "gainlose_d", gl_d );
    const glt_d = parseOneGainLoseDF( 'deciles-gl-table', gl_d.item );
    // const gl_ten = gl_d; // await d3.json("output-examples/gainlose-bytenure.json");
    const glt_ten = parseOneGainLoseDF( 'ten-gl-table', gl_ten.item );
    console.log( "ineqData.item[0].deciles", ineqData.item[0].deciles)
    console.log( "ineqData.item[1].deciles", ineqData.item[1].deciles)
    const [decchart,thumbnail] = drawDecileBarChart(
        ineqData.item[1].deciles.slice(20, 29), // 2d array compressed into 1 d for some reason
        ineqData.item[0].deciles.slice(20, 29));
    const gl_summary = `

    <table class='table-sm'>
        <tr>
            <th>Gainers</th><td class='text-success'>${fmt0(headlineData.item[1].gainers)}</td>
        </tr>
        <tr>
            <th>Losers</th><td class='text-danger'>${fmt0(headlineData.item[1].losers)}</td>
        </tr>
        <tr>
            <th>Unchanged</th><td class=''>${fmt0(headlineData.item[1].no_change)}</td>
        </tr>
    </table>

    `;
    const gl_content = `
        <h4>By Decile</h4>
        <div id='deciles-image' ></div>
        ${glt_d}
        <h4>By Tenure</h4>
        ${glt_ten}
    `;
    draw_media_and_modal(
        "info",
        "gainlose",
        "Gainers and losers",
        gl_summary,
        gl_content,
        'images/test-images/mental-health-canvas.png');

    $("#gainlose-image-thumbnail").append(thumbnail);
    $("#deciles-image").append(decchart);

}

async function processCosts(){
    const summaryData = await d3.json("output-examples/very-short-income-summary.json");
    const costsData = await d3.json("output-examples/short-income-summary.json");
    console.log( "summaryData", summaryData.item );
    console.log( "costsData", costsData.item );
    const sumCostsShort = formatJuliaDataframe( "costs-summary-short", summaryData.item, summaryCostsHighlighter, summaryIncluder );
    const sumCosts = formatJuliaDataframe( "costs-summary", summaryData.item, summaryCostsHighlighter );
    const fullCosts = formatJuliaDataframe( "costs-data", costsData.item, fullCostsHighlighter );
    var content = `
        <h4>Costs Summary</h4>
        ${sumCosts}
        <h4>Full Costs and Incomes</h4>
        ${fullCosts}
        `;
    draw_media_and_modal(
        "secondary",
        "costs",
        "Costs",
        sumCostsShort, // fullCosts,
        content,
        'images/test-images/mental-health-canvas.png');
}

async function processInequality(){

    const quantileData = await d3.json("output-examples/quantiles.json");
    const ineqData = await d3.json("output-examples/inequality.json");

    const palmadiff = formatAndClassSummary(
        ineqData.item[0].palma,
        ineqData.item[1].palma,
        ineqData.item[1].palma - ineqData.item[0].palma,
        false,
        fmt2 );
    const ginidiff = formatAndClassSummary(
        ineqData.item[0].gini,
        ineqData.item[1].gini,
        ineqData.item[1].gini - ineqData.item[0].gini,
        false,
        fmt2 );

    console.log( "quantileData", quantileData );
    console.log( "ineqData", ineqData );
    const [lorcurve, thumbnail] = drawLorenz( quantileData )
    const jd = jdiffs( ineqData, ["gini", "palma", "hoover", "average_income", "median"], [false,false,false,true,true]);
    const jt = jtable( ["Gini","Palma","Hoover Index", "Mean Income", "Median Income"], jd );
    var content = `
    <h4>Lorenz Curve</h4>
    <div>
    <ul>
        <li style='color:blue'>Pre</li>
        <li style='color:red'>Post</li>
    </ul>
    <div id='inequality-image'></div>
    </div>

    ${jt}

    `;

    var summary = `
    <table class='table-sm'>
        <tr>
            <th>Gini</th><td class='${ginidiff.glclass}'>${ginidiff.changestr}</td>
        </tr>
        <tr>
            <th>Palma</th><td class='${palmadiff.glclass}'>${palmadiff.changestr}</td>
        </tr>
    </table>
    `;
    //var (ineq1).plot()

    draw_media_and_modal(
        "orange",
        "inequality",
        "Inequality",
        summary,
        content,
        '');
    $("#inequality-image-thumbnail").append(thumbnail);
    $("#inequality-image").append(lorcurve);
}

async function processMETRs(){

    m0 = processOneHist( metrData.item[0])

    console.log( "m1", m1 );
    [h0,t0,h1,t1] = drawMRHist("MRs", m1, m0)
    var content = `
    <h4>thing</h4>
    <div>

    <p>Before</p>
    <div id='metrs-image-0'></div>
    <p>After</p>
    <div id='metrs-image-1'></div>
    </div>

    `;

    draw_media_and_modal(
        "primary",
        "metrs",
        "Work Incentives",
        "Metrs Summary",
        content,
        'images/test-images/mental-health-canvas.png');
    $("#metrs-image-thumbnail").append(t0);
    $("#metrs-image-0").append(h0);
    $("#metrs-image-1").append(h1);
}
