    console.log(x);

function make_thumb( marks_array ){
    return Plot.plot({
        x: {axis: null},
        y: {axis: null},
        marks: marks_array,
        width: 120,
        height: 80
    });
}


async function processInequality(){
    const quantileData = await d3.json("output-examples/quantiles.json");
    const ineqData = await d3.json("output-examples/inequality.json");
    console.log( quantileData );
    console.log( ineqData );
    var points0 = d3.zip(quantileData.item[0].columns[0], quantileData.item[0].columns[1]);
    var points1 = d3.zip(quantileData.item[1].columns[0], quantileData.item[1].columns[1]);
    points0.unshift([0,0]);
    points1.unshift([0,0]);
    console.log( points0 );
    console.log( points1 );

    const lorenz0 = Plot.line( points0, {stroke:"blue", curve: "catmull-rom"} ); //, {x: 0, y: 1})
    const lorenz1 = Plot.line( points1, {stroke:"red", curve: "catmull-rom"} ); //, {x: 0, y: 1})
    const equality = Plot.line( [[0,0],[1,1]], {stroke:"gray", label:"Equality"})
    const lorcurve = Plot.plot(
        { marks: [ lorenz0, lorenz1, equality ],
          color: {legend: true},
          title: "For charts, an informative title",
          subtitle: "Subtitle to follow with additional context",
          caption: "Figure 1. A chart with a title, subtitle, and caption.",

          y: {label: "Population Share", grid:true },
          x: {label: "Income Share", grid:true } })
    // var lorcurve = lorenz0;
    const thumbnail = make_thumb( [lorenz0, lorenz1, equality]); //, lorenz1, equality ])
    var bars = Plot.rectY(
                data,
                {
                    x1: "x1",
                    x2: "x2",
                    y: "weight",
                    fill: "steelblue"
                })

    var plot = Plot.plot({
        marks: [ bars ],
        y: {label: "Weight"},
        x: {label: "Value"}
    });
    // var thumbnail = make_thumb( [bars] );
    var content = `
    <div>
    <div id='inequality-image'></div>
    </div>

    `

    var palmadiff = formatAndClassSummary(
        ineqData.item[0].palma,
        ineqData.item[1].palma,
        ineqData.item[1].palma - ineqData.item[0].palma,
        false,
        fmt2 );
    var ginidiff = formatAndClassSummary(
        ineqData.item[0].gini,
        ineqData.item[1].gini,
        ineqData.item[1].gini - ineqData.item[0].gini,
        false,
        fmt2 );

    var summary = `
    <table class='table-sm'>
        <tr>
            <th>Gini</th><td class='${ginidiff.glclass}'>${ginidiff.changestr}</td>
        </tr>
        <tr>
            <th>Palma</th><td class='${palmadiff.glclass}'>${palmadiff.changestr}</td>
        </tr>
    </table>
    `
    //var (ineq1).plot()

    draw_media_and_modal(
        "orange",
        "inequality",
        "Inequality",
        summary,
        content,
        '');
    $("#inequality-image-thumbnail").append(thumbnail);
    $("#inequality-image").append(lorcurve);

    return quantileData;
}
